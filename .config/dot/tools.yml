# The dot toolchain registry — name -> location + description.
#
# A hand-edited directory of the CLIs I own, read by `bin/dot`. A tool joins by
# being listed here, wherever its code lives: a relative `location` resolves
# against ~/dotfiles, a ~/absolute one is used as-is (so out-of-repo tools link
# in too). `dot ls` reads `desc`; `dot show`/`dot where` resolve `location`.

brewup:
  desc: Update Homebrew, upgrade all formulae and my own tap's casks
  location: bin/brewup
  repo: dotfiles

clean:
  desc: Reclaim system caches — purge inactive memory, flush the DNS resolver
  location: bin/clean
  repo: dotfiles

display-font:
  desc: Size editor/terminal fonts from the connected display
  location: bin/display-font
  repo: dotfiles

dox:
  desc: docker-compose + git-worktree isolation helper
  location: ~/.local/bin/dox
  repo: dox

gwt:
  desc: Git worktree manager for .claude/worktrees
  location: ~/.local/bin/gwt-bin
  repo: gwt

jotter:
  desc: Session-note logging CLI (write, search, ls)
  location: /opt/homebrew/bin/jotter
  repo: jotter

notes:
  desc: CLI for Google Keep notes
  location: ~/.local/bin/notes
  repo: notes

ollama-warm:
  desc: Boot the Ollama daemon and pre-load a model
  location: bin/ollama-warm
  repo: dotfiles

plistgen:
  desc: Generate launchd plists for personal agents
  location: bin/plistgen
  repo: dotfiles

proj:
  desc: Quick cd into personal, client, or open-source projects
  location: lib/proj.rb
  repo: dotfiles

ruby-lsp-reap:
  desc: Reap orphaned ruby-lsp processes
  location: bin/ruby-lsp-reap
  repo: dotfiles

svc:
  desc: Manage personal launchd agents
  location: bin/svc
  repo: dotfiles

tasks:
  desc: CLI for Google Tasks
  location: ~/.local/bin/tasks
  repo: tasks

worktree-tripwire:
  desc: Catch whatever recreates stray .claude/worktrees directories
  location: bin/worktree-tripwire
  repo: dotfiles
